<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Athanni wordmark">
  <title>athanni — horizontal lockup</title>
  <defs>
    <radialGradient id="lfield" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#fdf3c4"/>
      <stop offset="38%" stop-color="#efd27a"/>
      <stop offset="72%" stop-color="#d3a93a"/>
      <stop offset="100%" stop-color="#a37c1d"/>
    </radialGradient>
    <radialGradient id="lrim" cx="50%" cy="47%" r="53%">
      <stop offset="0%" stop-color="#e9c96a"/>
      <stop offset="80%" stop-color="#d9b04a"/>
      <stop offset="100%" stop-color="#8f6c16"/>
    </radialGradient>
    <linearGradient id="lline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d3a93a"/>
      <stop offset="55%" stop-color="#8a6812"/>
      <stop offset="100%" stop-color="#d3a93a"/>
    </linearGradient>
    <g id="lfleuron">
