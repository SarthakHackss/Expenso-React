  <rect x="406" y="278" width="600" height="8" rx="4" fill="url(#lline)"/>
  <text x="406" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="8" fill="#8a6812">HALF A RUPEE, ALWAYS</text>
