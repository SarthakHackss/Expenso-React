      <g transform="rotate(60 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(90 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(120 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(150 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(180 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(210 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(240 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(270 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(300 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
      <g transform="rotate(330 256 256)"><use xlink:href="#lfleuron" href="#lfleuron" x="256" y="106"/></g>
