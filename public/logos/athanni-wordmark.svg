    <text x="256" y="330" font-size="185" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#fff3c6" opacity="0.55" text-anchor="middle" transform="translate(0 -3)">₹</text>
    <text x="256" y="330" font-size="185" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#6e4f0c" text-anchor="middle">₹</text>
