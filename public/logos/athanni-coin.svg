<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Athanni coin logo">
  <title>athanni — 50 paise coin logo</title>
  <defs>
    <radialGradient id="field" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#fdf3c4"/>
      <stop offset="38%" stop-color="#efd27a"/>
      <stop offset="72%" stop-color="#d3a93a"/>
      <stop offset="100%" stop-color="#a37c1d"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="47%" r="53%">
      <stop offset="0%" stop-color="#e9c96a"/>
      <stop offset="80%" stop-color="#d9b04a"/>
      <stop offset="100%" stop-color="#8f6c16"/>
    </radialGradient>
    <path id="arcTop" d="M 106 256 A 150 150 0 0 1 406 256"/>
    <path id="arcBottom" d="M 106 256 A 150 150 0 0 0 406 256"/>
    <path id="arcLeft" d="M 256 106 A 150 150 0 0 0 256 406"/>
    <g id="fleuron">
      <path d="M 0 -14 C 5 -9 5 -4 0 1 C -5 -4 -5 -9 0 -14 Z"/>
      <path d="M -1 -3 C -7 -5 -11 -9 -12 -15 C -6 -13 -2 -9 -1 -3 Z"/>
      <path d="M 1 -3 C 7 -5 11 -9 12 -15 C 6 -13 2 -9 1 -3 Z"/>
      <circle cx="0" cy="-19" r="2.2"/>
      <circle cx="0" cy="5" r="1.8"/>
    </g>
  </defs>

  <!-- coin body -->
  <circle cx="256" cy="256" r="250" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#7a5c12" stroke-width="3"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#f9edb8" stroke-width="2" opacity="0.45"/>
  <circle cx="256" cy="256" r="236" fill="url(#field)"/>

  <!-- pearled edge -->
  <circle cx="256" cy="256" r="243" fill="none" stroke="#8a6812" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="0.1 25.37" opacity="0.9"/>

  <!-- ornate border -->
  <g fill="#7a5a10">
    <g transform="rotate(0 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(22.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(45 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(67.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(90 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(112.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(135 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(157.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(180 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(202.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(225 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(247.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(270 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(292.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(315 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
    <g transform="rotate(337.5 256 256)"><use xlink:href="#fleuron" href="#fleuron" x="256" y="52"/></g>
  </g>
  <g fill="#7a5a10" opacity="0.9">
    <g transform="rotate(11.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(33.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(56.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(78.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(101.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(123.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(146.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(168.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(191.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(213.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(236.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(258.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(281.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(303.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(326.25 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
    <g transform="rotate(348.75 256 256)"><circle cx="256" cy="48" r="2.2"/></g>
  </g>

  <!-- top arc: brand -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <text font-size="44" letter-spacing="8" fill="#fff3c6" opacity="0.6" transform="translate(0 -2.5)">
      <textPath xlink:href="#arcTop" href="#arcTop" startOffset="50%">ATHANNI</textPath>
    </text>
    <text font-size="44" letter-spacing="8" fill="#6e4f0c">
      <textPath xlink:href="#arcTop" href="#arcTop" startOffset="50%">ATHANNI</textPath>
    </text>
  </g>

  <!-- left arc: devanagari -->
  <g font-family="'Nirmala UI','Mangal','Noto Sans Devanagari',sans-serif" font-weight="bold" text-anchor="middle">
    <text font-size="40" fill="#fff3c6" opacity="0.55" transform="translate(2.5 0)">
      <textPath xlink:href="#arcLeft" href="#arcLeft" startOffset="50%">अठन्नी</textPath>
    </text>
    <text font-size="40" fill="#6e4f0c">
      <textPath xlink:href="#arcLeft" href="#arcLeft" startOffset="50%">अठन्नी</textPath>
    </text>
  </g>

  <!-- bottom arc -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text font-size="26" letter-spacing="3" fill="#fff3c6" opacity="0.6" transform="translate(0 -2)">
      <textPath xlink:href="#arcBottom" href="#arcBottom" startOffset="50%">•  ½ RUPEE  •</textPath>
    </text>
    <text font-size="26" letter-spacing="3" fill="#6e4f0c">
      <textPath xlink:href="#arcBottom" href="#arcBottom" startOffset="50%">•  ½ RUPEE  •</textPath>
    </text>
  </g>

  <!-- center rupee mark + year -->
  <g text-anchor="middle">
    <text x="256" y="330" font-size="185" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#fff3c6" opacity="0.55" transform="translate(0 -3)">₹</text>
    <text x="256" y="330" font-size="185" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#6e4f0c">₹</text>
    <text x="256" y="372" font-size="32" letter-spacing="6" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#6e4f0c">2026</text>
  </g>
</svg>
