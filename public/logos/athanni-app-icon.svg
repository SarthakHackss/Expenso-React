<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Athanni app icon">
  <title>athanni — app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262a33"/>
      <stop offset="100%" stop-color="#0f1116"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0d060" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f0d060" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0d060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wfield" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#fdf3c4"/>
      <stop offset="38%" stop-color="#efd27a"/>
      <stop offset="72%" stop-color="#d3a93a"/>
      <stop offset="100%" stop-color="#a37c1d"/>
    </radialGradient>
    <radialGradient id="wrim" cx="50%" cy="47%" r="53%">
      <stop offset="0%" stop-color="#e9c96a"/>
      <stop offset="80%" stop-color="#d9b04a"/>
      <stop offset="100%" stop-color="#8f6c16"/>
    </radialGradient>
    <path id="warcBottom" d="M 144 256 A 112 112 0 0 0 368 256"/>
    <g id="wfleuron">
      <path d="M 0 -12 C 4.2 -7.7 4.2 -3.4 0 0.8 C -4.2 -3.4 -4.2 -7.7 0 -12 Z"/>
      <path d="M -0.8 -2.6 C -6 -4.3 -9.3 -7.7 -10.2 -13 C -5.1 -11.1 -1.7 -7.7 -0.8 -2.6 Z"/>
      <path d="M 0.8 -2.6 C 6 -4.3 9.3 -7.7 10.2 -13 C 5.1 -11.1 1.7 -7.7 0.8 -2.6 Z"/>
      <circle cx="0" cy="-16" r="2"/>
      <circle cx="0" cy="4" r="1.6"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>

  <!-- coin -->
  <circle cx="256" cy="256" r="185" fill="url(#wrim)"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#7a5c12" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="181" fill="none" stroke="#f9edb8" stroke-width="1.6" opacity="0.45"/>
  <circle cx="256" cy="256" r="174" fill="url(#wfield)"/>
  <circle cx="256" cy="256" r="179" fill="none" stroke="#8a6812" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 23.3" opacity="0.9"/>

  <g fill="#7a5a10">
    <g transform="rotate(0 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(30 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(60 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(90 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(120 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(150 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(180 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(210 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(240 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(270 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(300 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
    <g transform="rotate(330 256 256)"><use xlink:href="#wfleuron" href="#wfleuron" x="256" y="106"/></g>
  </g>
  <g fill="#7a5a10" opacity="0.9">
    <g transform="rotate(15 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(45 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(75 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(105 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(135 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(165 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(195 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(225 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(255 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(285 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(315 256 256)"><circle cx="256" cy="103" r="2"/></g>
    <g transform="rotate(345 256 256)"><circle cx="256" cy="103" r="2"/></g>
  </g>

  <!-- center rupee mark -->
  <g text-anchor="middle">
    <text x="256" y="302" font-size="130" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#fff3c6" opacity="0.55" transform="translate(0 -2.5)">₹</text>
    <text x="256" y="302" font-size="130" font-family="'Segoe UI','Nirmala UI','Segoe UI Symbol',Georgia,serif" font-weight="600" fill="#6e4f0c">₹</text>
  </g>

  <!-- brand arc -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <text font-size="30" letter-spacing="5" fill="#fff3c6" opacity="0.6" transform="translate(0 -2)">
      <textPath xlink:href="#warcBottom" href="#warcBottom" startOffset="50%">ATHANNI</textPath>
    </text>
    <text font-size="30" letter-spacing="5" fill="#6e4f0c">
      <textPath xlink:href="#warcBottom" href="#warcBottom" startOffset="50%">ATHANNI</textPath>
    </text>
  </g>
</svg>
